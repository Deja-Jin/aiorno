<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настоящее или ИИ?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Настоящее или ИИ?</h1>
    <p>В каждом вопросе сравни две версии одной и той же фотографии. Выбери ту, которая настоящая.</p>
    <section class="panel">
      <p><strong>Найдено пар:</strong> {{ available }}</p>
      {% if available == 0 %}
        <p class="hint">Пока не найдено ни одной совпадающей пары. Проверь имена файлов и папки ниже.</p>
      {% endif %}
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="question_count">Количество вопросов</label>
        <select id="question_count" name="question_count">
          {% for n in [5, 10, 20, 30, 50, 100] %}
            {% if n <= available %}
              <option value="{{ n }}">{{ n }}</option>
            {% endif %}
          {% endfor %}
          {% if available > 0 %}
            <option value="all">Все пары ({{ [available, 100]|min }})</option>
          {% endif %}
        </select>
        <button type="submit" {% if available == 0 %}disabled{% endif %}>Начать тест</button>
      </form>
    </section>
  </main>
</body>
</html>
